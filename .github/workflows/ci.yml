# Every push and pull request: the test suite, a static security scan and a dependency vulnerability audit.
# Actions are pinned to full commit SHAs (a tag can be moved; a SHA can't). Dependabot proposes updates.
name: CI

on:
  push:
    branches: [main, main_local]
  pull_request:
  workflow_call:        # the release workflow runs these same checks before publishing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-dev.txt
      - name: Install (pinned versions, CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install "$(grep '^torch==' requirements.txt)" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -c constraints.txt
          pip install -r requirements-dev.txt
          pip check
      - name: Tests
        env:
          DADS_NO_BROWSER: "1"
        run: pytest

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Bandit (fails on medium+ severity at medium+ confidence; full report always printed)
        run: |
          bandit -r src scripts main.py -f txt --exit-zero
          bandit -r src scripts main.py -q --severity-level medium --confidence-level medium
      - name: pip-audit (known vulnerabilities in every pinned package)
        run: pip-audit -r requirements.txt -r constraints.txt --progress-spinner off --desc
